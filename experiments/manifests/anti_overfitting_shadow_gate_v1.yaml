scientific_question: Does a candidate-blind cross-fit Shadow write-back gate reduce adaptive Optimize-to-Validation optimism without reducing final Validation Vote?
hypotheses:
  - Repeated Optimize100 reuse produces train-positive but Shadow-negative candidate winners.
  - A winner-only Shadow50 gate filters harmful write-backs without becoming a second optimization set.
  - Reduced accepted-commit throughput can be beneficial when mean transfer quality improves.
