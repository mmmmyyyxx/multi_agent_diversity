scientific_question: Does responsibility-conditioned member evolution induce useful task-relevant complementarity under compute-matched RR/W1 allocation?
hypotheses:
  - Responsibility-conditioned evolution improves useful coverage and Validation Vote relative to Generic under eligible round-robin allocation.
  - W1 and responsibility-conditioned evolution may interact rather than contribute additively.
  - Lower correctness correlation alone is not evidence of useful diversity.
design:
  arms: [D0 Static, D1 canonical Generic-S0, D2 RR Generic, D3 W1 Generic, D4 RR Responsibility-conditioned, D5 W1 Responsibility-conditioned]
  factorial: {allocation: [eligible round-robin, W1], proposal: [Generic, Responsibility-conditioned]}
  changed: [target allocation factor, proposal context factor]
  unchanged: [five agents, equal-weight plurality, tie abstention, same-start initialization, Common-Safe, ranking, max-one commit, train split, validation split]
  forbidden_changes: [test access, validation-aware selection, selector tuning, fairness forcing, semantic Critic in D4 or D5, new M2F trigger, weighted voting, seed replacement, horizon extension, outcome-based retry]
